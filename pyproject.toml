[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "if-theory"
version = "1.0.0"
description = "Information Field Theory cosmology validation code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Phuc Vinh Truong", email = "phuc@phuc.net" },
]
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "astropy",
  "matplotlib",
  "seaborn>=0.13.0",
  "jupyter",
  "numba",
  "scikit-learn",
  "tqdm",
  "requests",
  "psutil",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["analysis", "core", "predictions", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests", "audits"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
  "books",
  "evidence",
  "papers",
  "swarms",
  "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = [
  "E501",
  "E402",
  "F403",
  "F405",
]
