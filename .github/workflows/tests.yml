name: validation tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy astropy sympy pytest

      - name: Run pytest suite
        run: python -m pytest tests/ -v

      - name: Run Mersenne tower verification
        run: python mersenne_tower_theorem.py

      - name: Verify canonical constants module-load assertion
        run: python -c "from prime_field_util import verify_canonical_constants; verify_canonical_constants(); print('OK')"

  smoke-tests:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy astropy sympy

      - name: Smoke test - hubble_tension_bubble (no external data needed)
        run: python predictions/hubble_tension_bubble_test.py

      - name: Smoke test - delta_max derivation
        run: python predictions/delta_max_derivation.py

      - name: Smoke test - Casimir consistency (analytical)
        run: python predictions/casimir_consistency_test.py

  adversarial:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy astropy sympy

      - name: Run adversarial scripts (theory-breaking attempts)
        run: |
          if [ -d adversarial ]; then
            for script in adversarial/*.py; do
              if [ -f "$script" ]; then
                echo "::group::Running $script"
                python "$script" || echo "::warning::$script returned non-zero — see output"
                echo "::endgroup::"
              fi
            done
          else
            echo "No adversarial/ directory yet."
          fi

  integrity:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy astropy sympy

      - name: Verify predictions produce parseable JSON
        run: |
          python -c "
          import json, glob, os
          failed = []
          for path in glob.glob('evidence/**/*.json', recursive=True):
              try:
                  with open(path) as f:
                      json.load(f)
              except Exception as e:
                  failed.append(f'{path}: {e}')
          if failed:
              print('Malformed JSON in evidence/:')
              for f in failed:
                  print(f'  {f}')
              raise SystemExit(1)
          print(f'All {len(glob.glob(\"evidence/**/*.json\", recursive=True))} evidence/ JSON files parse cleanly.')
          "

      - name: Re-run deterministic predictions and check output stability
        run: |
          mkdir -p /tmp/integrity-check
          python predictions/hubble_tension_bubble_test.py > /tmp/integrity-check/hubble.log 2>&1 || true
          python predictions/delta_max_derivation.py > /tmp/integrity-check/delta.log 2>&1 || true
          python predictions/casimir_consistency_test.py > /tmp/integrity-check/casimir.log 2>&1 || true
          echo "Predictions re-run without crash:"
          ls -la /tmp/integrity-check/
